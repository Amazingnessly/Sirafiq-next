<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ed" />
    <meta name="color-scheme" content="light" />
    <title>Sirāfiq Next</title>
    <style>
      .boot-state { min-height: 100vh; display: grid; place-items: center; padding: 32px; color: #4f1e2d; background: #f4f0e9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
      .boot-state__card { max-width: 560px; padding: 28px; border-radius: 24px; background: rgba(255,253,249,.9); box-shadow: 0 20px 60px rgba(62,45,38,.08); }
      .boot-state strong { display: block; margin-bottom: 8px; font-size: 20px; }
      .boot-state p { margin: 0; color: #746d68; line-height: 1.6; }
    </style>
    <script>
      (function () {
        function showBootError(message) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '';
          var outer = document.createElement('div');
          outer.className = 'boot-state';
          var card = document.createElement('div');
          card.className = 'boot-state__card';
          var title = document.createElement('strong');
          title.textContent = 'Sirāfiq n’a pas pu démarrer';
          var text = document.createElement('p');
          text.textContent = message || 'Une erreur de compatibilité ou de chargement est survenue.';
          card.appendChild(title);
          card.appendChild(text);
          outer.appendChild(card);
          root.appendChild(outer);
        }
        window.__sirafiqBootError = showBootError;
        window.addEventListener('error', function (event) {
          showBootError(event && event.message ? event.message : 'Le code de l’application n’a pas pu être chargé.');
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          showBootError(reason && reason.message ? reason.message : 'Une erreur est survenue pendant le démarrage.');
        });
      }());
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-state">
        <div class="boot-state__card">
          <strong>Chargement de Sirāfiq…</strong>
          <p>Initialisation de la bibliothèque locale et de la synchronisation.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
