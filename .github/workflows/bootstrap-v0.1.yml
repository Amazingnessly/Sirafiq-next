name: Bootstrap V0.1 source

on:
  push:
    branches:
      - feat/v0.1-foundation
    paths:
      - bootstrap-src.b64

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.1-foundation

      - name: Rebuild and expand source archive
        run: |
          base64 --decode bootstrap-src.b64 > /tmp/sirafiq-src.zip
          unzip -q -o /tmp/sirafiq-src.zip -d .
          rm -f bootstrap-src.b64 bootstrap-src.zip .github/workflows/bootstrap-v0.1.yml

      - name: Commit V0.1 foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github docs migrations public src tests worker .gitignore .npmrc AGENTS.md README.md VALIDATION.md index.html package.json playwright.config.ts tsconfig.app.json tsconfig.json tsconfig.worker.json vite.config.ts wrangler.jsonc
          git rm --cached --ignore-unmatch bootstrap-src.b64 bootstrap-src.zip .github/workflows/bootstrap-v0.1.yml
          git commit -m "feat: add Sirafiq Next V0.1 foundation"
          git push origin HEAD:feat/v0.1-foundation
